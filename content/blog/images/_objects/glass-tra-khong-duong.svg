<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600">
  <!-- A glass of clear unsweetened iced tea with ice cubes. Drawn by scripts/blog-art in _templates/glass-cup.svg. -->
  <defs>
    <path id="silhouette" d="M50,96 A150,42 0 0 1 350,96 L322,528 A122,34 0 0 1 78,528 Z"/>
    <path id="frontWall" d="M50,96 A150,42 0 0 0 350,96 L322,528 A122,34 0 0 1 78,528 Z"/>
    <path id="interior" d="M61,97 A139,39 0 0 1 339,97 L312,494 A112,31 0 0 1 88,494 Z"/>
    <path id="glassBand" fill-rule="evenodd" d="M50,96 A150,42 0 0 1 350,96 L322,528 A122,34 0 0 1 78,528 Z M61,97 A139,39 0 0 1 339,97 L312,494 A112,31 0 0 1 88,494 Z"/>
    <path id="base" d="M88,494 A112,31 0 0 0 312,494 L322,528 A122,34 0 0 1 78,528 Z"/>
    <ellipse id="opening" cx="200" cy="97" rx="139" ry="39"/>
    <path id="rim" fill-rule="evenodd" d="M50,96 A150,42 0 0 1 350,96 A150,42 0 0 1 50,96 Z M61,97 A139,39 0 0 1 339,97 A139,39 0 0 1 61,97 Z"/>

    <clipPath id="contentsClip"><use href="#silhouette"/><rect width="400" height="97"/></clipPath>
    <clipPath id="frontClip"><use href="#frontWall"/></clipPath>
    <clipPath id="backHalf"><rect width="400" height="96"/></clipPath>
    <clipPath id="frontHalf"><rect y="96" width="400" height="504"/></clipPath>

    <linearGradient id="innerWall" x1="0" y1="58" x2="0" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FC4A0" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#A8EAD3" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#E4FAF2" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="rimFill" x1="50" y1="0" x2="350" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4FFFB" stop-opacity="0.96"/>
      <stop offset="0.35" stop-color="#C9F3E4" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#9FE5CD" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5DCCA8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="wallTint" x1="0" y1="100" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D8F7EC" stop-opacity="0.12"/>
      <stop offset="0.6" stop-color="#A3E8D0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4CC39C" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="wallEdges" x1="50" y1="0" x2="350" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E9A78" stop-opacity="0.55"/>
      <stop offset="0.08" stop-color="#4FC9A3" stop-opacity="0.28"/>
      <stop offset="0.24" stop-color="#BFF0E0" stop-opacity="0"/>
      <stop offset="0.76" stop-color="#BFF0E0" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#3FBE97" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#17896A" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="bandFill" x1="0" y1="100" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FE1C6" stop-opacity="0.65"/>
      <stop offset="0.7" stop-color="#58CDA8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#22A07D" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="baseFill" x1="0" y1="494" x2="0" y2="562" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7EDCBE" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#C5F4E4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2FAE89" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="120" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimShine" x1="50" y1="0" x2="350" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="seeThrough" filterUnits="userSpaceOnUse" x="0" y="0" width="400" height="600" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.2"/>
      <feColorMatrix values="0.82 0 0 0 0.03  0 0.93 0 0 0.07  0 0 0.88 0 0.06  0 0 0 1 0"/>
    </filter>
    <filter id="soft1" filterUnits="userSpaceOnUse" x="-100" y="-100" width="600" height="800"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="soft3" filterUnits="userSpaceOnUse" x="-100" y="-100" width="600" height="800"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft8" filterUnits="userSpaceOnUse" x="-100" y="-100" width="600" height="800"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft16" filterUnits="userSpaceOnUse" x="-100" y="-100" width="600" height="800"><feGaussianBlur stdDeviation="16"/></filter>

    <g id="contents">
<defs>
<linearGradient id="q1" gradientUnits="userSpaceOnUse" x1="62.8" y1="0" x2="337.2" y2="0"><stop offset="0" stop-color="#8A3E08"/><stop offset="0.1" stop-color="#B8600E"/><stop offset="0.3" stop-color="#D9821C"/><stop offset="0.45" stop-color="#E8952A"/><stop offset="0.65" stop-color="#D57E1A"/><stop offset="0.88" stop-color="#AE560C"/><stop offset="1" stop-color="#7E3606"/></linearGradient>
<linearGradient id="q2" gradientUnits="userSpaceOnUse" x1="0" y1="124" x2="0" y2="525"><stop offset="0" stop-color="#5A2404" stop-opacity="0.25"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#F7C26A" stop-opacity="0.35"/></linearGradient>
<radialGradient id="q3" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="1" fx="0" fy="0" gradientTransform="translate(158.9 112.5) rotate(0) scale(178.313 49.928)"><stop offset="0" stop-color="#F2B458"/><stop offset="0.6" stop-color="#D98A2A"/><stop offset="1" stop-color="#A85A12"/></radialGradient>
</defs>
<path d="M62.8,124 A137.2,38.4 0 0 1 337.2,124 L312,494 A112,31 0 0 1 88,494 Z" fill="url(#q1)"/>
<path d="M62.8,124 A137.2,38.4 0 0 1 337.2,124 L312,494 A112,31 0 0 1 88,494 Z" fill="url(#q2)"/>
<clipPath id="teaBody"><path d="M62.8,124 A137.2,38.4 0 0 1 337.2,124 L312,494 A112,31 0 0 1 88,494 Z"/></clipPath>
<g clip-path="url(#teaBody)"><g transform="rotate(-12 150 175)"><rect x="115" y="140" width="70" height="70" rx="11.2" fill="#FFF4E0" fill-opacity="0.42" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5"/><rect x="126.2" y="149.8" width="25.2" height="9.8" rx="4.2" fill="#FFFFFF" fill-opacity="0.7"/></g><g transform="rotate(14 236 168)"><rect x="199" y="131" width="74" height="74" rx="11.8" fill="#FFF4E0" fill-opacity="0.42" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5"/><rect x="210.8" y="141.4" width="26.6" height="10.4" rx="4.4" fill="#FFFFFF" fill-opacity="0.7"/></g><g transform="rotate(28 190 238)"><rect x="156" y="204" width="68" height="68" rx="10.9" fill="#FFF4E0" fill-opacity="0.32" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2.5"/><rect x="166.9" y="213.5" width="24.5" height="9.5" rx="4.1" fill="#FFFFFF" fill-opacity="0.6"/></g><g transform="rotate(-20 258 290)"><rect x="228" y="260" width="60" height="60" rx="9.6" fill="#FFF4E0" fill-opacity="0.24" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.5"/><rect x="237.6" y="268.4" width="21.6" height="8.4" rx="3.6" fill="#FFFFFF" fill-opacity="0.5"/></g><g transform="rotate(8 138 318)"><rect x="109" y="289" width="58" height="58" rx="9.3" fill="#FFF4E0" fill-opacity="0.2" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2.5"/><rect x="118.3" y="297.1" width="20.9" height="8.1" rx="3.5" fill="#FFFFFF" fill-opacity="0.5"/></g></g>
<ellipse cx="200" cy="124" rx="137.2" ry="38.4" fill="url(#q3)"/>
<path d="M63.8,124 A136.2,37.9 0 0 1 336.2,124" fill="none" stroke="#FFE6B8" stroke-width="4"/>
<path d="M65.8,126 A134.2,36.9 0 0 0 334.2,126" fill="none" stroke="#8E4A12" stroke-opacity="0.6" stroke-width="3"/>
<path d="M128,120 L160,110 L184,122 L152,132 Z" fill="#FFF8EC" fill-opacity="0.85" stroke="#FFFFFF" stroke-width="2"/>
<path d="M214,114 L250,108 L266,122 L230,128 Z" fill="#FFF8EC" fill-opacity="0.85" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </defs>

  <!-- The back of the glass, behind the drink -->
  <use href="#silhouette" fill="#D4F5EA" fill-opacity="0.3"/>
  <use href="#rim" fill="url(#rimFill)" clip-path="url(#backHalf)"/>
  <use href="#opening" fill="url(#innerWall)"/>
  <path d="M50,96 A150,42 0 0 1 350,96" fill="none" stroke="#178A6A" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M63,94 A137,37 0 0 1 337,94" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M58,84 A146,40 0 0 1 150,57" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" filter="url(#soft1)"/>

  <!-- The drink -->
  <g clip-path="url(#contentsClip)"><use href="#contents"/></g>

  <!-- The front wall: the drink seen through tinted glass, thicker and greener at the edges and base -->
  <g clip-path="url(#frontClip)">
    <use href="#contents" filter="url(#seeThrough)"/>
    <use href="#frontWall" fill="url(#wallTint)"/>
    <use href="#glassBand" fill="url(#bandFill)"/>
    <use href="#frontWall" fill="url(#wallEdges)"/>
    <use href="#base" fill="url(#baseFill)"/>
    <path d="M94,520 A114,30 0 0 0 306,520" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="5" filter="url(#soft3)"/>
    <path d="M88,494 A112,31 0 0 0 312,494" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
    <path d="M82,130 L104,470" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="40" stroke-linecap="round" filter="url(#soft16)"/>
    <path d="M72,134 L92,486" fill="none" stroke="url(#streak)" stroke-width="9" stroke-linecap="round" filter="url(#soft1)"/>
    <path d="M104,170 L114,420" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" filter="url(#soft1)"/>
    <path d="M330,150 L312,470" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round" filter="url(#soft1)"/>
    <path d="M306,260 L296,420" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="12" stroke-linecap="round" filter="url(#soft8)"/>
  </g>
  <g clip-path="url(#frontClip)">
    <use href="#silhouette" fill="none" stroke="#159272" stroke-opacity="0.35" stroke-width="14" filter="url(#soft8)"/>
  </g>

  <!-- The front of the rim -->
  <use href="#rim" fill="url(#rimFill)" clip-path="url(#frontHalf)"/>
  <path d="M61,97 A139,39 0 0 0 339,97" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2"/>
  <use href="#frontWall" fill="none" stroke="#178A6A" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M52,101 A148,40 0 0 0 348,101" fill="none" stroke="url(#rimShine)" stroke-width="3"/>
  <path d="M74,120 A146,40 0 0 0 140,134" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" filter="url(#soft1)"/>
  <path d="M80,116 Q82,125 91,127 Q82,129 80,138 Q78,129 69,127 Q78,125 80,116 Z" fill="#FFFFFF"/>
</svg>
