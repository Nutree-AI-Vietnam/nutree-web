<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560">
  <!--
    Glass bowl for blog illustrations (see "Images" in content/blog/README.md).
    Copy this file to content/blog/images/_objects/<name>.svg, draw the food inside
    <g id="contents"> at the end of <defs>, and change nothing else.

    - The opening is the ellipse cx=320 cy=172 rx=252 ry=70; light comes from the top left.
    - Start with <use href="#interior" fill="..."/>: the food seen through the glass below the rim.
    - Then heap the food over the opening. It may rise to about y=40, above the back of the rim.
    - The bowl draws the glass over the food. Draw no background and no shadow: the compose step
      adds the shadow under the bowl.
  -->
  <defs>
    <path id="silhouette" d="M48,170 A272,78 0 0 1 592,170 C592,300 525,410 430,440 L436,458 A116,24 0 0 1 204,458 L210,440 C115,410 48,300 48,170 Z"/>
    <path id="frontWall" d="M48,170 A272,78 0 0 0 592,170 C592,300 525,410 430,440 L436,458 A116,24 0 0 1 204,458 L210,440 C115,410 48,300 48,170 Z"/>
    <path id="interior" d="M68,172 A252,70 0 0 1 572,172 C572,288 512,382 430,404 C380,418 260,418 210,404 C128,382 68,288 68,172 Z"/>
    <path id="glassBand" fill-rule="evenodd" d="M48,170 A272,78 0 0 1 592,170 C592,300 525,410 430,440 L436,458 A116,24 0 0 1 204,458 L210,440 C115,410 48,300 48,170 Z M68,172 A252,70 0 0 1 572,172 C572,288 512,382 430,404 C380,418 260,418 210,404 C128,382 68,288 68,172 Z"/>
    <path id="foot" d="M210,440 A110,20 0 0 0 430,440 L436,458 A116,24 0 0 1 204,458 Z"/>
    <ellipse id="opening" cx="320" cy="172" rx="252" ry="70"/>
    <path id="rim" fill-rule="evenodd" d="M48,170 A272,78 0 0 1 592,170 A272,78 0 0 1 48,170 Z M68,172 A252,70 0 0 1 572,172 A252,70 0 0 1 68,172 Z"/>

    <clipPath id="contentsClip"><use href="#silhouette"/><rect width="640" height="172"/></clipPath>
    <clipPath id="frontClip"><use href="#frontWall"/></clipPath>
    <clipPath id="backHalf"><rect width="640" height="171"/></clipPath>
    <clipPath id="frontHalf"><rect y="171" width="640" height="389"/></clipPath>

    <linearGradient id="innerWall" x1="0" y1="102" x2="0" y2="242" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FC4A0" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#A8EAD3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E4FAF2" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="rimFill" x1="48" y1="0" x2="592" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4FFFB" stop-opacity="0.96"/>
      <stop offset="0.35" stop-color="#C9F3E4" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#9FE5CD" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5DCCA8" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="insideShade" gradientUnits="userSpaceOnUse" cx="300" cy="236" r="300" gradientTransform="translate(300 236) scale(1 0.72) translate(-300 -236)">
      <stop offset="0.45" stop-color="#0D5E49" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#0D5E49" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0D5E49" stop-opacity="0.42"/>
    </radialGradient>
    <linearGradient id="wallTint" x1="0" y1="176" x2="0" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D8F7EC" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#A3E8D0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4CC39C" stop-opacity="0.46"/>
    </linearGradient>
    <linearGradient id="wallEdges" x1="48" y1="0" x2="592" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E9A78" stop-opacity="0.55"/>
      <stop offset="0.07" stop-color="#4FC9A3" stop-opacity="0.28"/>
      <stop offset="0.22" stop-color="#BFF0E0" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#BFF0E0" stop-opacity="0"/>
      <stop offset="0.92" stop-color="#3FBE97" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#17896A" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="bandFill" x1="0" y1="176" x2="0" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FE1C6" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#58CDA8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#22A07D" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="footFill" x1="0" y1="440" x2="0" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7EDCBE" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#C5F4E4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2FAE89" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="206" x2="0" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.75" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rimShine" x1="48" y1="0" x2="592" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>

    <filter id="seeThrough" filterUnits="userSpaceOnUse" x="0" y="0" width="640" height="560" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.6"/>
      <feColorMatrix values="0.8 0 0 0 0.03  0 0.92 0 0 0.07  0 0 0.86 0 0.06  0 0 0 1 0"/>
    </filter>
    <filter id="soft1" filterUnits="userSpaceOnUse" x="-100" y="-100" width="840" height="760"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="soft3" filterUnits="userSpaceOnUse" x="-100" y="-100" width="840" height="760"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="soft8" filterUnits="userSpaceOnUse" x="-100" y="-100" width="840" height="760"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soft16" filterUnits="userSpaceOnUse" x="-100" y="-100" width="840" height="760"><feGaussianBlur stdDeviation="16"/></filter>

    <g id="contents">
      <!-- Draw the food here. -->
    </g>
  </defs>

  <!-- The back of the bowl, behind the food -->
  <use href="#silhouette" fill="#D4F5EA" fill-opacity="0.3"/>
  <use href="#rim" fill="url(#rimFill)" clip-path="url(#backHalf)"/>
  <use href="#opening" fill="url(#innerWall)"/>
  <path d="M48,170 A272,78 0 0 1 592,170" fill="none" stroke="#178A6A" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M70,168 A250,68 0 0 1 570,168" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M60,150 A268,76 0 0 1 236,96" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" filter="url(#soft1)"/>
  <path d="M420,98 A262,74 0 0 1 560,128" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round" filter="url(#soft1)"/>

  <!-- The food -->
  <g clip-path="url(#contentsClip)"><use href="#contents"/></g>

  <!-- The front wall: the food seen through tinted glass, thicker and greener at the edges and base -->
  <g clip-path="url(#frontClip)">
    <use href="#contents" filter="url(#seeThrough)"/>
    <use href="#interior" fill="url(#insideShade)"/>
    <use href="#frontWall" fill="url(#wallTint)"/>
    <use href="#glassBand" fill="url(#bandFill)"/>
    <use href="#frontWall" fill="url(#wallEdges)"/>
    <use href="#foot" fill="url(#footFill)"/>
    <path d="M216,452 A104,16 0 0 0 424,452" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="5" filter="url(#soft3)"/>
    <path d="M210,440 A110,20 0 0 0 430,440" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
    <path d="M214,406 C262,422 378,422 426,406" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" filter="url(#soft1)"/>
    <path d="M72,190 C74,262 102,334 160,390" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="44" stroke-linecap="round" filter="url(#soft16)"/>
    <path d="M78,214 C82,282 108,342 158,388" fill="none" stroke="url(#streak)" stroke-width="9" stroke-linecap="round" filter="url(#soft1)"/>
    <path d="M104,232 C108,276 122,314 146,346" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" filter="url(#soft1)"/>
    <path d="M568,222 C566,282 546,334 502,376" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round" filter="url(#soft1)"/>
    <path d="M520,300 C510,330 494,352 474,370" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round" filter="url(#soft8)"/>
  </g>
  <g clip-path="url(#frontClip)">
    <use href="#silhouette" fill="none" stroke="#159272" stroke-opacity="0.35" stroke-width="16" filter="url(#soft8)"/>
  </g>

  <!-- The front of the rim -->
  <use href="#rim" fill="url(#rimFill)" clip-path="url(#frontHalf)"/>
  <path d="M68,172 A252,70 0 0 0 572,172" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2"/>
  <use href="#frontWall" fill="none" stroke="#178A6A" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M50,176 A270,76 0 0 0 590,176" fill="none" stroke="url(#rimShine)" stroke-width="3"/>
  <path d="M84,206 A262,72 0 0 0 200,236" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" filter="url(#soft1)"/>
  <path d="M94,199 Q96,209 106,211 Q96,213 94,223 Q92,213 82,211 Q92,209 94,199 Z" fill="#FFFFFF"/>
</svg>
